services:
  db:
    image: postgres:15-alpine
    container_name: suomi_postgres
    restart: always
    environment:
      POSTGRES_DB: suomi_master
      POSTGRES_USER: suomi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuomiMaster2026_Kokkola_Secure!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suomi"]
      interval: 10s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: suomi_redis
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suomi_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://suomi:${POSTGRES_PASSWORD}@db:5432/suomi_master
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: "*"
      WEATHER_LAT: 63.8333
      WEATHER_LNG: 23.1333
    volumes:
      - ./templates:/app/templates
      - ./plugins:/app/plugins
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/self-check"]
      interval: 30s
      timeout: 10s
      retries: 3
  nginx:
    image: nginx:alpine
    container_name: suomi_nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
  certbot:
    image: certbot/certbot
    container_name: suomi_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
volumes:
  postgres_data:
  redis_data:
