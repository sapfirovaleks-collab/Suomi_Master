<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suomi Master v6.4 AUTO MAX PARTNERS</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-main: #0f172a; --panel-bg: rgba(15,23,42,0.95); --accent-blue: #38bdf8; --accent-gold: #f59e0b; --accent-red: #ef4444; --accent-green: #10b981; --text-main: #f8fafc; --border-color: #1e293b; --card-bg: #1e293b; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:var(--bg-main); color:var(--text-main); display:flex; height:100vh; overflow:hidden; }
        #sidebar { width:100%; background:var(--panel-bg); backdrop-filter:blur(12px); border-right:1px solid var(--border-color); display:flex; flex-direction:column; z-index:1000; }
        .header { padding:12px; border-bottom:1px solid var(--border-color); background:#0f172a; }
        .header-top { display:flex; justify-content:space-between; align-items:center; }
        .header h1 { font-size:1.1rem; font-weight:700; color:var(--accent-blue); display:flex; align-items:center; gap:6px; }
        .badge-pro { background:linear-gradient(135deg,#f59e0b,#d97706); color:#000; font-size:0.6rem; padding:2px 5px; border-radius:4px; font-weight:800; }
        .badge-max { background:linear-gradient(135deg,#38bdf8,#0284c7); color:#fff; font-size:0.6rem; padding:2px 5px; border-radius:4px; font-weight:800; }
        .nav-tabs { display: flex; flex-wrap: wrap; grid-template-columns:repeat(5,1fr); gap:2px; padding:5px; background:#020617; border-bottom:1px solid var(--border-color); }
        .tab-btn { background:transparent; border:none; color:#94a3b8; padding:7px 2px; font-size:0.62rem; font-weight:600; cursor:pointer; border-radius:4px; text-align:center; }
        .tab-btn.active, .tab-btn:hover { background:#1e293b; color:var(--accent-blue); }
        .content-area { flex:1; overflow-y:auto; padding:8px; }
        .card { background:var(--card-bg); border:1px solid var(--border-color); border-radius:8px; padding:9px; margin-bottom:7px; }
        .card h3 { font-size:0.82rem; color:#f1f5f9; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center; }
        .card p { font-size:0.72rem; color:#94a3b8; line-height:1.35; }
        #map { flex:1; height:100%; }
        .input-mini { background:#1e293b; color:#fff; border:1px solid #334155; border-radius:4px; padding:4px 6px; font-size:0.7rem; width:70px; }
        .btn-mini { background:#0284c7; color:#fff; border:none; border-radius:4px; padding:5px 8px; font-size:0.7rem; font-weight:600; cursor:pointer; }
    </style>

<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0284c7">

</head>
<body>
    <div id="sidebar">
        <div class="header">
            <div class="header-top">
                <h1>🇫🇮 Suomi Master <span class="badge-pro">PRO</span><span class="badge-max">6.4 MAX</span></h1>
            </div>
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchSection('avtodor')">🚗 Авто</button>
        </div>
        <div class="content-area" id="list-container"></div>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([63.8333, 23.1333], 7);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        function openAffiliate(url, partnerId, dealId) {
            if(partnerId || dealId) {
                fetch(`/api/auto/partners/click?partner_id=${partnerId||0}${dealId?`&deal_id=${dealId}`:''}`, {method:'POST'}).catch(()=>{});
            }
            window.open(url + (url.includes('?')?'&':'?')+'utm_source=suomi-master', '_blank');
        }

        async function switchSection(section) {
            const container = document.getElementById('list-container');
            if (section === 'avtodor') {
                container.innerHTML = `
                <div class="card" style="border-color:#38bdf8;background:linear-gradient(135deg,#0c4a6e,#082f49);">
                    <h3>🏎️ AUTO MAX PARTNERS 6.4</h3>
                    <p style="font-size:0.68rem;">Renault Scenic 2 1.6 16V • Партнеры Коккола, шины, страховка, ТО</p>
                    <div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;">
                        <button class="btn-mini" style="background:#7e22ce;" onclick="loadAutoDeals()">🔥 HOT Deals</button>
                        <button class="btn-mini" style="background:#0e7490;" onclick="loadAutoPartners()">🤝 Партнеры</button>
                        <button class="btn-mini" style="background:#065f46;" onclick="loadTyres()">🛞 Шины</button>
                    </div>
                </div>
                <div id="auto-deals-list"></div>
                <div id="auto-partners-list"></div>
                <div id="auto-tyres-list"></div>
                <div id="auto-insurance-list"></div>
                `;
                loadAutoDeals(); loadAutoPartners(); loadTyres(); loadInsurance();
            }
        }

        async function loadAutoPartners() {
            const el = document.getElementById('auto-partners-list'); if(!el) return;
            try {
                const res = await fetch('/api/auto/partners?city=Kokkola');
                const data = await res.json();
                let html = `<div class="card"><h3>🤝 Партнеры (${data.count})</h3>`;
                data.partners.forEach(p=>{
                    html += `<div style="margin-top:4px;padding:5px;background:#0f172a;border-radius:4px;">
                        <b>${p.company}</b> - ${p.category}<br>
                        <button class="btn-mini" style="margin-top:4px;background:#7e22ce;" onclick="openAffiliate('${p.affiliate_url}', ${p.id}, null)">🛒 Открыть скидку</button>
                    </div>`;
                });
                html += '</div>'; el.innerHTML = html;
            } catch(e){}
        }

        async function loadAutoDeals() {
            const el = document.getElementById('auto-deals-list'); if(!el) return;
            try {
                const res = await fetch('/api/auto/deals');
                const data = await res.json();
                let html = `<div class="card" style="border-color:#ec4899;"><h3>🔥 HOT Deals</h3>`;
                data.deals.forEach(d=>{
                    html += `<div style="margin-top:4px;padding:5px;background:#0f172a;border-radius:4px;">
                        <b>${d.title}</b> -${d.discount}%<br>
                        <button class="btn-mini" style="margin-top:4px;background:#ec4899;" onclick="openAffiliate('${d.affiliate_url}', ${d.partner_id}, ${d.id})">🔥 Купить с скидкой</button>
                    </div>`;
                });
                html += '</div>'; el.innerHTML = html;
            } catch(e){}
        }

        async function loadTyres() {
            const el = document.getElementById('auto-tyres-list'); if(!el) return;
            try {
                const res = await fetch('/api/auto/tyres/search?size=205/60 R16');
                const data = await res.json();
                let html = `<div class="card"><h3>🛞 Шины ${data.size}</h3>`;
                data.tyres.forEach(t=>{
                    html += `<div style="margin-top:4px;padding:5px;background:#0f172a;border-radius:4px;">
                        <b>${t.brand} ${t.model}</b> - ${t.price}€<br>
                        <button class="btn-mini" style="margin-top:4px;background:#059669;" onclick="openAffiliate('${t.affiliate_url}', 0, null)">🛞 Купить</button>
                    </div>`;
                });
                html += '</div>'; el.innerHTML = html;
            } catch(e){}
        }

        async function loadInsurance() {
            const el = document.getElementById('auto-insurance-list'); if(!el) return;
            try {
                const res = await fetch('/api/auto/insurance');
                const data = await res.json();
                let html = `<div class="card"><h3>🛡️ Страховка авто</h3>`;
                data.insurance.forEach(ins=>{
                    html += `<div style="margin-top:4px;padding:5px;background:#0f172a;border-radius:4px;">
                        <b>${ins.company} ${ins.type}</b> от ${ins.price_from}€<br>
                        <button class="btn-mini" style="margin-top:4px;background:#d97706;" onclick="openAffiliate('${ins.affiliate_url}', 0, null)">🛡️ Оформить</button>
                    </div>`;
                });
                html += '</div>'; el.innerHTML = html;
            } catch(e){}
        }

        switchSection('avtodor');
    </script>

<div id="nav-disclaimer" style="position: fixed; bottom: 5px; left: 10px; font-size: 10px; color: #64748b; z-index: 1000; background: rgba(255,255,255,0.85); padding: 2px 6px; border-radius: 4px; font-weight: bold;">
    ⚠️ Kartat ovat viitteellisiä. Ei viralliseen merenkulkuun.
</div>

</body>
</html>
